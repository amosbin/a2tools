# /etc/a2tools/a2tools.conf.d/00-defaults.conf
#
# a2tools default configuration — installed by the package and overwritten on
# every upgrade. To change a value persistently, either edit
# /etc/a2tools/a2tools.conf (loaded AFTER every drop-in, so it always wins)
# or drop a new file in /etc/a2tools/a2tools.conf.d/ with a higher numeric
# prefix (e.g. 99-local.conf). Files in conf.d/ are loaded in lexicographic
# order, then /etc/a2tools/a2tools.conf is loaded last.

# ---------------------------------------------------------------------------
# Paths (override only if your install deviates from the FHS layout)
# ---------------------------------------------------------------------------
# A2TOOLS_ETC="/etc/a2tools"
# A2TOOLS_STATE="/var/lib/a2tools"
# A2TOOLS_CACHE_DIR="/var/cache/a2tools"
# A2TOOLS_LOG_DIR="/var/log/a2tools"

# ---------------------------------------------------------------------------
# docker-mailserver (used by a2wcrecalc-dms)
# ---------------------------------------------------------------------------
# Stack directory (the one holding compose.yaml). Defaults to the podmgr
# layout; overridden per run by a2wcrecalc-dms -d/--dir.
DMS_DIR="/srv/podmgr/compose/dms"

# Directory the container mounts as /tmp/docker-mailserver. a2wcrecalc-dms
# writes sni_cert_map and 99-sni.conf here. podmgr keeps it under data/; a
# plain compose layout usually uses "$DMS_DIR/config".
DMS_CONFIG_DIR="/srv/podmgr/compose/dms/data/config"

# Host user that owns the stack. With rootless podman this user is root
# inside the container, so a2wcrecalc-dms grants it read access to the
# certificates under the root-only /etc/letsencrypt. Leave empty for a
# rootful stack, which needs no ACL.
# For the podmgr dms container it is the owner of the stack's compose file:
#   stat -c %U /srv/podmgr/compose/dms/compose.yaml
DMS_OWNER="dms"

# ---------------------------------------------------------------------------
# WAN IP detection
# ---------------------------------------------------------------------------
# HTTPS fallback reflector (only consulted if the DNS reflectors fail).
# WAN_IP_LOOKUP_URL="https://ifconfig.me/ip"
